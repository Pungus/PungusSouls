ps_runestone_sif1: "The Grave of Artorias"
ps_runestone_sif1_text: "The grave of Lord Gwyn's Knight Artorias, who fell to the Abyss... Long ago, An abyss was begat of an ancient beast, and threatened to swallow the whole of Oolacile. Kight Artorias and the young grey wolf Sif, steped forth to face the darkness. Alas, Artorias was no match for the father of the Abyss and was overcome by its utter blackness.... Deeply scarred by the Abyss, Artorias used his shield to form a barrier to protect his compatriot Sif. Spared the fate of her formed master, Sif now gaurds the grave until her master is avenged...."
