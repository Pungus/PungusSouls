ps_runestone_start1: "Strange Runes"
ps_runestone_start1_text: "The fire fades... Distant lands converge.... and soon, only Dark will remain. Even now, there are only embers.... Welcome to Heritage of Lordran - PungusSouls Reborn. This is a mod that adds new content to the game, including new areas, enemies, and items as seen in FromSoftwares Souls series. Touch the Bonfire to get started"
