ps_runestone_andre1: "Blacksmith Forge"
ps_runestone_andre1_text: "This is Andre of Astora, the renowned blacksmith. He can craft & upgrade weapons & armor at the forge, for a price.  To craft or upgrade stronger weapons, Andre needs special materials called 'Embers' which can be given to him to upgrade his crafting tier. Embers drop from World Bosses, starting with the Elder"
ps_runestone_shalquoir: "Sweet Shalquoir"
ps_runestone_shalquoir_text: "This is Shalquoir, the sweet and loveable feline of the distant land, Drangleic. Shalqouir has made many friends in her travels. Help her find them and they may join your cause...."
